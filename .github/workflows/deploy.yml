name: Node.js CI/CD Pipeline

# 1. THE TRIGGER: When does this pipeline run?
on:
  push:
    branches:
      - main 

jobs:
  # 2. THE CI PHASE: Continuous Integration
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Pulls your code onto the runner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Faster, stricter alternative to npm install for CI environments

      - name: Run Tests
        run: npm test

  # 3. THE CD PHASE: Continuous Deployment
  deploy:
    needs: build # Crucial: deploy will NOT run if the build job fails
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Production Deployment
        env:
          # Pulling a secret variable safely from GitHub Settings
          API_KEY: ${{ secrets.PROD_API_KEY }} 
        run: |
          echo "Connecting to production server..."
          echo "Deploying newly built artifact..."
          echo "Deployment successful!"