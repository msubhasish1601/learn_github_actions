name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main 

jobs:
  # --- CI PHASE ---
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # --- CD PHASE: Build & Push ---
  publish-image:
    needs: build
    runs-on: ubuntu-latest
    
    # VIP Pass: Grants GitHub Actions permission to write to GHCR
    permissions:
      contents: read
      packages: write 
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags the image as: ghcr.io/your-username/learn_github_actions:latest
          tags: ghcr.io/${{ github.repository }}:latest