name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main 

jobs:
  # 1. THE CI PHASE (Keep this exactly as you had it)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # 2. THE CD PHASE: Build and Push Docker Image
  publish-image:
    needs: build
    runs-on: ubuntu-latest
    
    # Grant the pipeline permission to write to GitHub Packages
    permissions:
      contents: read
      packages: write 
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Officially supported Docker action to log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Officially supported Docker action to build and push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Dynamically tags the image with your GitHub username and repo name
          tags: ghcr.io/${{ github.repository }}:latest